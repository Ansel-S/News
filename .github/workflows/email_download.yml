name: Email Download

on:
  schedule:
    - cron: "0 3 */3 * *"   # every 3 days, 03:00 UTC — matches RETRY_BUDGET_ATTEMPTS=3 in email_download.py
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Init Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Init database
        run: python scripts/db_init.py handled

      - name: Scan inbox + process pending downloads
        run: python scripts/email_download.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: imap.gmail.com
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit handled.db (LFS)
        continue-on-error: true
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add database/handled.db database/email_download_failures.json
          git commit -m "email_download · $(date -u +'%Y-%m-%d')" || true
          git push || true
