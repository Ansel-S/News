name: Update CN IP Lists

# Fully independent of every other workflow in this repo — no shared
# schedule, secrets, dependencies, or scripts with the dewsletter/ side.
# Lives in the same repo as a convenience (one Actions dashboard, one
# place to look), not because it's functionally related to the newsletter.

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点运行
  workflow_dispatch:        # 允许手动触发
  push:
    branches: [ main ]
    paths:
      - 'geoip/**'
      - '.github/workflows/geoip-update.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate IP lists
        working-directory: geoip
        run: bash generate.sh

      - name: Stash generated files outside the repo tree
        # Needed before switching branches below: git checkout release
        # replaces the whole working tree to match that orphan branch,
        # which doesn't contain a geoip/ directory at all — so geoip/dist/
        # (created by the step above) would be wiped out along with it if
        # we didn't copy it somewhere the branch switch can't touch first.
        run: |
          mkdir -p /tmp/geoip-dist
          cp geoip/dist/* /tmp/geoip-dist/

      - name: Push to release branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin
          git checkout release 2>/dev/null || git checkout --orphan release

          # 清空分支内容，只保留生成的文件
          git rm -rf . --quiet 2>/dev/null || true

          cp -f /tmp/geoip-dist/* .

          git add cn-ipv4.txt
          git add cn-ipv6.txt
          git add clash-ruleset.list
          git add chnroute.ipset
          git add chnroute6.ipset

          git commit -m "Updated at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "Nothing to commit"

      - name: Push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: release
          force: true
