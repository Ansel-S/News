name: Report Monthly

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Init Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests trafilatura pyyaml

      - name: Init database
        run: python scripts/db_init.py report

      - name: Ingest RSS + scraped sources, download PDFs (report.db)
        run: python scripts/ingest_rss.py report

      - name: Render HTML + build reports.zip
        run: python scripts/render_report.py

      - name: Read subject
        id: subject
        run: |
          if [ -f out_report.html ] && [ -f out_report_subject.txt ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "value=$(cat out_report_subject.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "nothing to send this month — skipping email"
          fi

      - name: Build attachment list
        if: steps.subject.outputs.send == 'true'
        id: attachments
        run: |
          if [ -f reports.zip ]; then
            echo "value=reports.zip" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email
        if: steps.subject.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.TO_EMAIL }}
          from: Dewsletter <${{ secrets.SMTP_USER }}>
          subject: ${{ steps.subject.outputs.value }}
          html_body: file://out_report.html
          attachments: ${{ steps.attachments.outputs.value }}

      - name: Commit database (LFS)
        continue-on-error: true
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add database/report.db
          git commit -m "report monthly · $(date -u +'%Y-%m')" || true
          git push || true
