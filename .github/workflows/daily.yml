name: Daily

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Init Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests trafilatura pyyaml

      - name: Init databases
        run: python scripts/db_init.py core hn

      - name: Ingest RSS (core.db)
        run: python scripts/ingest_rss.py core

      - name: Ingest HackerNews (hn.db)
        run: python scripts/ingest_hn.py

      - name: Render daily HTML
        run: python scripts/render_daily.py

      - name: Ensure daily zip attachment exists
        run: |
          if [ ! -f out_daily.zip ]; then
            echo "no full-text articles today" > _placeholder.txt
            zip out_daily.zip _placeholder.txt
            rm _placeholder.txt
          fi

      - name: Upload today's daily assets to GitHub Release
        run: |
          python scripts/upload_daily_release.py \
            --repo "${{ github.repository }}" \
            --tag "$(date -u +'%Y-%m-%d')" \
            out_daily.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Read daily subject
        id: subject
        run: |
          if [ -f out_daily.html ] && [ -f out_daily_subject.txt ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "value=$(cat out_daily_subject.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "nothing to send today — skipping email"
          fi

      - name: Send daily email
        if: steps.subject.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.TO_EMAIL }}
          from: Dewsletter <${{ secrets.SMTP_USER }}>
          subject: ${{ steps.subject.outputs.value }}
          html_body: file://out_daily.html
          attachments: out_daily.zip

      - name: Render Extra HTML (TLDR / Ruanyf / HelloGitHub)
        run: python scripts/render_extra.py

      - name: Check if Extra has content
        id: extra_check
        run: |
          if [ -f out_extra.html ]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure extra zip attachment exists
        if: steps.extra_check.outputs.has_content == 'true'
        run: |
          if [ ! -f out_extra.zip ]; then
            echo "no full-text articles today" > _placeholder.txt
            zip out_extra.zip _placeholder.txt
            rm _placeholder.txt
          fi

      - name: Upload today's extra assets to GitHub Release
        if: steps.extra_check.outputs.has_content == 'true'
        run: |
          python scripts/upload_daily_release.py \
            --repo "${{ github.repository }}" \
            --tag "$(date -u +'%Y-%m-%d')" \
            out_extra.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Read extra subject
        if: steps.extra_check.outputs.has_content == 'true'
        id: extra_subject
        run: echo "value=$(cat out_extra_subject.txt)" >> "$GITHUB_OUTPUT"

      - name: Send extra email
        if: steps.extra_check.outputs.has_content == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.TO_EMAIL }}
          from: Dewsletter <${{ secrets.SMTP_USER }}>
          subject: ${{ steps.extra_subject.outputs.value }}
          html_body: file://out_extra.html
          attachments: out_extra.zip

      - name: Commit databases (LFS)
        continue-on-error: true
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add database/core.db database/hn.db
          git commit -m "daily · $(date -u +'%Y-%m-%d')" || true
          git push || true
