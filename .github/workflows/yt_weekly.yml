name: YouTube Weekly

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Init Git LFS
        run: git lfs install

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install feedparser requests pyyaml yt-dlp

      - name: Init database
        run: python scripts/db_init.py youtube

      - name: Ingest YouTube (subtitles + low-res video/audio per channel mode)
        run: python scripts/ingest_youtube.py
        env:
          YT_WORKERS: "3"
          LOOKBACK_DAYS: "8"

      - name: Upload low-res video/audio to GitHub Release
        if: always()
        run: |
          if [ -d media_out ] && [ "$(find media_out -type f ! -name '*.tsv' | wc -l)" -gt 0 ]; then
            python scripts/upload_yt_release.py \
              --repo "${{ github.repository }}" \
              --tag "$(date -u +'%Y-%m-%d')"
          else
            echo "no media to upload, skipping"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Render HTML (also writes yt_subtitles.zip)
        run: python scripts/render_yt.py

      - name: Check if there's anything to send
        id: check
        run: |
          if [ -f out_yt_subject.txt ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "render_yt: nothing to send, skipping email"
          fi

      - name: Ensure zip attachment exists
        if: steps.check.outputs.send == 'true'
        run: |
          if [ ! -f out_yt.zip ]; then
            echo "no subtitles this week" > _placeholder.txt
            zip out_yt.zip _placeholder.txt
            rm _placeholder.txt
          fi

      - name: Read subject
        if: steps.check.outputs.send == 'true'
        id: subject
        run: echo "value=$(cat out_yt_subject.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.check.outputs.send == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.TO_EMAIL }}
          from: Dewsletter <${{ secrets.SMTP_USER }}>
          subject: ${{ steps.subject.outputs.value }}
          html_body: file://out_yt.html
          attachments: out_yt.zip

      - name: Clean up local media files
        if: always()
        run: rm -rf media_out

      - name: Commit database (LFS)
        continue-on-error: true
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add database/youtube.db
          git commit -m "yt weekly · $(date -u +'%Y-%m-%d')" || true
          git push || true
