# feeds/yt.yaml
# YouTube channels
# channel_id: fill from youtube.com/channel/<id> or youtube.com/@handle page
# All entries go to youtube.db, issue: yt_weekly
#
# mode: how much of this channel's content is actually carried by subtitles.
#   subtitle — subtitles alone are high-signal (talking-head/commentary channels
#              like 马司库, VEXILLA). Keep current behavior: download + clean subs only.
#   video    — subtitles are useless (ASMR, football/sports tutorials, music).
#              Subtitles are skipped entirely; render_yt should offer a
#              low-res (720p or lower, vp09/av01) video via GitHub Release instead.
#   mixed    — subtitles help but don't tell the whole story (most channels).
#              Default when `mode` is omitted. Subtitles are downloaded as today;
#              a low-res video release can optionally be added later per-video.
#   audio    — video track adds nothing; only the audio matters (podcasts,
#              interviews, music-only channels without visuals).
# `mode: FILL_ME` marks a channel not yet classified — ingest_youtube falls back
# to `mixed` (today's behavior) until it is filled in.

