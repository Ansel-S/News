# feeds/rss.yaml
# All RSS/Atom sources
# display_mode: full | title_excerpt | title_only | repo_card | chart_only
# db: core | dive | zen | paper | report
# issue: daily | dive_weekly | zen_weekly | paper_weekly | report_monthly
#
# One organization, multiple RSS feeds you want all of (e.g. RAND publishes
# separate feeds for Economy / Policy / Security): add one `source` entry per
# feed, not one entry with multiple urls. Give each a distinguishing name
# ("RAND - Economy", "RAND - Policy", ...) so they're identifiable in the
# email and in the db. This also lets each feed have its own display_mode —
# e.g. a monthly-report feed as `full` and a news/press-release feed as
# `title_excerpt` — which a single shared-name entry couldn't express.
#   - name: RAND - Commentary
#     url: https://www.rand.org/pubs/commentary.xml
#     display_mode: title_excerpt
#   - name: RAND - Article
#     url: https://www.rand.org/pubs/articles.xml
#     display_mode: full

