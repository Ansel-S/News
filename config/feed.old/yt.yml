# feeds/yt.yaml
# YouTube channels
# channel_id: fill from youtube.com/channel/<id> or youtube.com/@handle page
# All entries go to youtube.db, issue: yt_weekly
#
# mode: a LIST of what to fetch for this channel. Combine as many as apply —
#   e.g. a channel needing both video and audio separately: [video, audio].
#   A channel that needs everything: [subtitle, video, audio].
#
#   subtitle — subtitles alone are high-signal (talking-head/commentary/
#              teaching-by-speech channels). Downloads + cleans subtitles.
#              Accepts both .vtt and .ass caption files.
#   video    — download a low-res (720p or lower, vp09/av01) video-only file,
#              uploaded later as a GitHub Release asset (visuals matter:
#              demos, tutorials with on-screen steps, pets, looks/vibe-driven
#              content).
#   audio    — download audio-only (m4a/opus), also uploaded as a Release asset.
#              Use alongside `video` when both are independently useful, or
#              alone when the video track adds nothing and tone/voice matters
#              more than a searchable transcript.
#   mixed    — shorthand for "subtitles help but don't tell the whole story":
#              tries subtitles first; if none are found, falls back to audio
#              (listening > watching by default); if even audio isn't
#              available, falls back to a low-res video as a last resort.
#              This is the DEFAULT when `mode` is omitted or `[FILL_ME]`.
#
# `mode: [FILL_ME]` marks a channel not yet classified — ingest_youtube falls
#                   back to `[mixed]` until it is filled in.

